
name: Setup Fortran Conda CI/CD
#credit: https://github.com/gha3mi/setup-fortran-conda/tree/main
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:

  # Run FPM tests (debug + release) on all OS/compiler combinations
  # NOTE (2026-08-27): conda-forge flang 23.1.0 (uploaded 2026-08-27) is broken --
  # its run deps list libllvm23/libclang-cpp23.1 but not libmlir23, so the binary
  # fails with "libMLIR.so.23.1: cannot open shared object file". flang-new is
  # pinned to 22.1.8 below until conda-forge fixes the recipe.
  test_fpm:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gfortran, ifx, flang-new]
        include:
          - os: ubuntu-latest
            extra-packages: "openblas"
        exclude:
          - os: macos-latest
            compiler: flang-new
          - os: macos-latest
            compiler: ifx
          - os: macos-latest
            compiler: nvfortran
          - os: windows-latest
            compiler: nvfortran

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler == 'flang-new' && '22.1.8' || '' }}
          platform: ${{ matrix.os }}
          extra-packages: ${{ matrix.extra-packages }}

      - name: fpm test (release)
        run: fpm test --compiler ${{ matrix.compiler }} --profile release --verbose

  # Run CMake + Ninja build/tests across OS/compiler matrix
  test_cmake:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_cmake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest ]
        compiler: [gfortran, ifx, flang-new, nvfortran]
        include:
          - os: ubuntu-latest
            extra-packages: "openblas"
        exclude:
          - os: macos-latest
            compiler: flang-new
          - os: macos-latest
            compiler: ifx
          - os: macos-latest
            compiler: nvfortran
          - os: windows-latest
            compiler: nvfortran

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler == 'flang-new' && '22.1.8' || '' }}
          platform: ${{ matrix.os }}
          extra-packages: ${{ matrix.extra-packages }}

      - name: cmake test (release)
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=${{ matrix.compiler }} -G Ninja
          cmake --build build/release
          ctest --test-dir build/release --output-on-failure

  # Consume pic-blas the way a downstream project does, via FetchContent.
  # The jobs above build it standalone, where CMAKE_BINARY_DIR and
  # PROJECT_BINARY_DIR are the same directory, so a target that leaks the
  # consumer's build tree cannot fail there. This one can.
  test_consumer:
    name: ubuntu-latest_gfortran_consumer
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: gfortran
          platform: ubuntu-latest
          extra-packages: "openblas"

      - name: cmake consume (release)
        run: |
          cmake -S ci/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran -DPIC_BLAS_SOURCE_DIR="$PWD" -G Ninja
          cmake --build build/consumer
          ctest --test-dir build/consumer -R consumer_runs --no-tests=error --output-on-failure

  # Install pic-blas and consume it with find_package.
  # Nothing else in CI runs `cmake --install`, so pic-blasConfig.cmake was
  # never exercised: it could name dependencies that do not resolve, or omit
  # ones it needs, and every other job would still be green.
  test_install:
    name: ubuntu-latest_gfortran_install
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: gfortran
          platform: ubuntu-latest
          extra-packages: "openblas"

      - name: cmake install and consume (release)
        run: |
          cmake -S . -B build/inst -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran -DENABLE_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$PWD/prefix" -G Ninja
          cmake --build build/inst
          cmake --install build/inst
          cmake -S ci/installed-consumer -B build/inst-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_PREFIX_PATH="$PWD/prefix" -G Ninja
          cmake --build build/inst-consumer
          ctest --test-dir build/inst-consumer -R installed_consumer_runs --no-tests=error --output-on-failure

  # Run Fortran linter with Fortitude
  linter_fortitude:
    name: Run Fortitude Linter
    runs-on: ubuntu-latest
    steps:
      - name: Run Fortitude Linter
        uses: gha3mi/setup-fortran-conda@latest
        with:
          fortitude-check: true
          fortitude-settings: "--output-format github"
